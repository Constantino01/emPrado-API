services:
  db:
    image: postgres:16-alpine
    container_name: school_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_database
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    user: "1000:1000"
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: school_api
    working_dir: /var/www
    volumes:
      - ./api:/var/www
    ports:
      - "8000:8000"
    command: sh -c "if [ ! -f artisan ]; then sleep infinity; else php artisan serve --host=0.0.0.0 --port=8000; fi"
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: school_frontend
    working_dir: /app
    volumes:
      - ./public:/app/public
      - ./dashboard:/app/dashboard
    ports:
      - "5173:5173"
      - "5174:5174"
    command: >
      sh -c "
        cd /app/public && npm install && npm run dev -- --host 0.0.0.0 --port 5173 &
        cd /app/dashboard && npm install && npm run dev -- --host 0.0.0.0 --port 5174
      "

  # =======================================================
  # FASE 2: NGINX (Atualmente Inativo)
